name: GC-AUDIT Registry Contract
on:
  push:
    paths:
      - 'gc-audit/GC-AUDIT-REGISTRY.yaml'
      - 'gc-audit/tools/validate_operation_registry.py'
      - 'gc-audit/tests/test_operation_registry.py'
      - '.github/workflows/gc-audit-registry-contract.yml'
  pull_request:
    paths:
      - 'gc-audit/GC-AUDIT-REGISTRY.yaml'
      - 'gc-audit/tools/validate_operation_registry.py'
      - 'gc-audit/tests/test_operation_registry.py'
      - '.github/workflows/gc-audit-registry-contract.yml'
permissions:
  contents: read
jobs:
  registry-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6.0.2,<7'
      - name: Run registry adversarial tests
        run: python -m unittest discover -s gc-audit/tests -p 'test_operation_registry.py' -v
      - name: Self-audit operation registry
        run: python gc-audit/tools/validate_operation_registry.py --registry gc-audit/GC-AUDIT-REGISTRY.yaml --portfolio-root ..
