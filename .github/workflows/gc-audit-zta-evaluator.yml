name: GC-AUDIT ZTA Evaluator Core
on:
  push:
    paths:
      - 'gc-audit/tools/zta_evaluator.py'
      - 'gc-audit/schemas/zta/**'
      - 'gc-audit/tests/zta/**'
      - '.github/workflows/gc-audit-zta-evaluator.yml'
  pull_request:
    paths:
      - 'gc-audit/tools/zta_evaluator.py'
      - 'gc-audit/schemas/zta/**'
      - 'gc-audit/tests/zta/**'
      - '.github/workflows/gc-audit-zta-evaluator.yml'
permissions:
  contents: read
jobs:
  evaluator-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install schema validator
        run: python -m pip install 'jsonschema[format]>=4.18,<5' 'cryptography>=42,<47'
      - name: Validate schemas
        run: python gc-audit/tests/zta/validate-schemas.py
      - name: Test evaluator core
        run: python -m unittest discover -s gc-audit/tests/zta -p 'test_*.py' -v
