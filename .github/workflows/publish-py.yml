name: Publish governance-commons (Python) to PyPI

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publisher

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance-commons-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Check dist
        run: twine check dist/*

      - name: Run tests
        run: |
          pip install -e ".[dev]"
          pytest

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: governance-commons-sdk/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/governance-commons/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No api-token needed — uses OIDC trusted publisher.
        # Configure at: https://pypi.org/manage/project/governance-commons/settings/publishing/
        # Publisher settings: owner=governancecommons repo=governance-commons-sdk
        # workflow=publish-py.yml environment=pypi
