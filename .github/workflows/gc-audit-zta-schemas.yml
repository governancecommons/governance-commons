name: GC-AUDIT ZTA Schema Contracts
on:
  push:
    paths:
      - 'gc-audit/schemas/zta/**'
      - 'gc-audit/tests/zta/**'
      - '.github/workflows/gc-audit-zta-schemas.yml'
  pull_request:
    paths:
      - 'gc-audit/schemas/zta/**'
      - 'gc-audit/tests/zta/**'
      - '.github/workflows/gc-audit-zta-schemas.yml'
permissions:
  contents: read
jobs:
  schema-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema[format]>=4.18,<5'
      - name: Validate schema fixtures
        run: python gc-audit/tests/zta/validate-schemas.py
