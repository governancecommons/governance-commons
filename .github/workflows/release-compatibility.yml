name: Release compatibility checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - run: python -m unittest discover -s tests -p test_release_compatibility.py -v
